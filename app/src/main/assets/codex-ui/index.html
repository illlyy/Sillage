<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<title>Codex</title>
<style>
:root{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#202123;background:#fff;color-scheme:light;--border:#e6e6e3;--muted:#70706b;--soft:#f7f7f5;--hover:#f0f0ed;--accent:#111;--sidebar:280px}*{box-sizing:border-box}html,body{height:100%;margin:0;overflow:hidden}button,textarea{font:inherit}.app{height:100%;display:flex;background:#fff}.sidebar{width:var(--sidebar);flex:0 0 var(--sidebar);background:#f7f7f5;border-right:1px solid var(--border);display:flex;flex-direction:column;padding:10px;z-index:20}.brand{height:44px;display:flex;align-items:center;gap:10px;padding:0 8px;font-weight:650}.logo{width:27px;height:27px;border-radius:8px;background:#111;color:white;display:grid;place-items:center;font-size:15px}.icon-btn{border:0;background:transparent;border-radius:8px;width:36px;height:36px;display:grid;place-items:center;color:#5b5b57}.icon-btn:hover{background:var(--hover)}.new-thread{margin:8px 0 12px;border:1px solid #deded9;background:white;border-radius:9px;height:39px;display:flex;align-items:center;padding:0 11px;gap:9px;font-weight:520;box-shadow:0 1px 1px #00000008}.section-label{font-size:11px;color:#8a8a85;padding:10px 9px 5px;font-weight:600;text-transform:uppercase;letter-spacing:.04em}.thread-list{flex:1;overflow:auto}.thread{padding:9px;border-radius:8px;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#44443f}.thread.active,.thread:hover{background:#eaeae6;color:#111}.sidebar-footer{border-top:1px solid var(--border);padding-top:8px}.account{display:flex;align-items:center;gap:10px;padding:8px;border-radius:8px;font-size:13px}.avatar{width:25px;height:25px;border-radius:50%;background:linear-gradient(145deg,#222,#777);color:#fff;display:grid;place-items:center;font-size:11px}.main{min-width:0;flex:1;display:flex;flex-direction:column;position:relative}.topbar{height:55px;border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 16px;gap:10px;flex:0 0 auto}.mobile-menu{display:none}.project{font-size:13px;font-weight:550}.project-sub{font-size:12px;color:var(--muted)}.spacer{flex:1}.status{display:flex;align-items:center;gap:6px;color:#74746e;font-size:12px}.status-dot{width:7px;height:7px;border-radius:50%;background:#c58b32}.status-dot.ready{background:#2e9f65}.canvas{flex:1;overflow:auto;position:relative;padding:0 20px 160px}.welcome{max-width:760px;margin:18vh auto 0}.welcome h1{font-size:28px;line-height:1.2;margin:0 0 8px;letter-spacing:-.025em;font-weight:600}.welcome p{margin:0;color:var(--muted);font-size:14px}.quick-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:24px}.quick{border:1px solid var(--border);background:#fff;border-radius:10px;padding:13px;text-align:left;font-size:13px;color:#3c3c38}.quick:hover{background:var(--soft)}.conversation{max-width:820px;margin:0 auto;padding-top:28px}.message{display:flex;gap:13px;padding:16px 2px}.message .who{width:27px;height:27px;border-radius:7px;display:grid;place-items:center;flex:0 0 auto;font-size:12px;font-weight:650}.message.user .who{background:#e8e8e4}.message.agent .who{background:#111;color:#fff}.message-body{min-width:0;flex:1;line-height:1.58;font-size:14px;white-space:pre-wrap;overflow-wrap:anywhere;padding-top:2px}.step{margin:7px 0 7px 40px;border-left:2px solid #deded8;padding:5px 10px;color:#77776f;font-size:12px}.error{max-width:820px;margin:10px auto;color:#a43e35;background:#fff4f2;border:1px solid #f0d0cc;border-radius:8px;padding:9px 12px;font-size:12px;display:none}.composer-wrap{position:absolute;left:0;right:0;bottom:0;padding:40px 20px max(18px,env(safe-area-inset-bottom));background:linear-gradient(transparent 0,#fff 38%)}.composer{max-width:820px;margin:0 auto;border:1px solid #d8d8d3;border-radius:14px;background:#fff;box-shadow:0 5px 20px #00000012;padding:11px 11px 9px}.composer textarea{display:block;width:100%;border:0;outline:0;resize:none;min-height:46px;max-height:160px;padding:5px 6px;color:#202123;background:transparent;line-height:1.45}.composer-actions{display:flex;align-items:center;gap:5px}.pill{border:0;background:transparent;color:#66665f;border-radius:7px;padding:6px 8px;font-size:12px}.pill:hover{background:var(--soft)}.send{margin-left:auto;width:31px;height:31px;border:0;border-radius:8px;background:#111;color:white;display:grid;place-items:center}.send:disabled{background:#c9c9c4}.overlay{display:none}
@media(max-width:760px){.sidebar{position:fixed;inset:0 auto 0 0;transform:translateX(-102%);transition:transform .2s ease;box-shadow:8px 0 30px #0002}.sidebar.open{transform:translateX(0)}.overlay.open{display:block;position:fixed;inset:0;background:#0004;z-index:15}.mobile-menu{display:grid}.topbar{padding:0 10px}.canvas{padding:0 13px 155px}.welcome{margin-top:14vh}.welcome h1{font-size:25px}.quick-grid{grid-template-columns:1fr}.composer-wrap{padding-left:10px;padding-right:10px}.conversation{padding-top:12px}.message{gap:10px;padding:13px 0}.step{margin-left:37px}}
@media(prefers-color-scheme:dark){:root{color:#ececea;background:#151515;--border:#31312e;--muted:#9d9d97;--soft:#20201e;--hover:#292926;--accent:#f3f3ef}.app,.main{background:#151515}.sidebar{background:#1b1b1a}.new-thread,.quick,.composer{background:#20201e;border-color:#353531;color:#ececea}.topbar{background:#171716}.thread.active{background:#2a2a27;color:#fff}.icon-btn{color:#b8b8b1}.project-sub,.status{color:#999}.composer-wrap{background:linear-gradient(transparent 0,#151515 38%)}.composer textarea{color:#eee}.message.user .who{background:#373733}.error{background:#321f1d;border-color:#63342f;color:#ffaaa1}.logo,.message.agent .who,.send{background:#f1f1ed;color:#111}}
</style>
</head>
<body>
<div class="app">
<div id="overlay" class="overlay" onclick="toggleSidebar(false)"></div>
<aside id="sidebar" class="sidebar">
  <div class="brand"><span class="logo">C</span><span>Codex</span><span style="flex:1"></span><button class="icon-btn" onclick="toggleSidebar(false)">×</button></div>
  <button class="new-thread" onclick="newChat()"><span style="font-size:19px">＋</span> New thread</button>
  <div class="section-label">Threads</div>
  <div id="threads" class="thread-list"><div class="thread active">New coding task</div></div>
  <div class="sidebar-footer"><div class="account"><span class="avatar">I</span><div><div>ilyop</div><div style="color:var(--muted);font-size:11px">Local workspace</div></div></div></div>
</aside>
<main class="main">
  <header class="topbar"><button class="icon-btn mobile-menu" onclick="toggleSidebar(true)">☰</button><div><div class="project">Home workspace</div><div class="project-sub">~/</div></div><div class="spacer"></div><div class="status"><span id="dot" class="status-dot"></span><span id="statusText">Starting service…</span></div></header>
  <div id="error" class="error"></div>
  <section id="canvas" class="canvas">
    <div id="welcome" class="welcome"><h1>What do you want to work on?</h1><p>Ask Codex to build, debug, review, or explain code in your workspace.</p><div class="quick-grid"><button class="quick" onclick="usePrompt('Inspect this workspace and explain the project structure')">Explore the workspace</button><button class="quick" onclick="usePrompt('Review the current code for bugs and suggest fixes')">Review the code</button><button class="quick" onclick="usePrompt('Run the project tests and fix any failures')">Run and fix tests</button><button class="quick" onclick="usePrompt('Help me implement a new feature')">Build a feature</button></div></div>
    <div id="conversation" class="conversation"></div>
  </section>
  <div class="composer-wrap"><div class="composer"><textarea id="input" rows="1" placeholder="Ask Codex to work on something"></textarea><div class="composer-actions"><button class="pill">＋</button><button class="pill">Local ▾</button><button class="pill">gpt-5.6-sol ▾</button><button id="send" class="send" onclick="send()">↑</button></div></div></div>
</main></div>
<script>
const input=document.getElementById('input'),conversation=document.getElementById('conversation'),welcome=document.getElementById('welcome'),canvas=document.getElementById('canvas'),errorBox=document.getElementById('error'),sendBtn=document.getElementById('send');let currentAgent=null,busy=false;
function toggleSidebar(open){document.getElementById('sidebar').classList.toggle('open',open);document.getElementById('overlay').classList.toggle('open',open)}
function usePrompt(t){input.value=t;input.focus()}
function message(role,text){welcome.style.display='none';const row=document.createElement('div');row.className='message '+role;row.innerHTML='<div class="who">'+(role==='user'?'Y':'C')+'</div><div class="message-body"></div>';row.querySelector('.message-body').textContent=text;conversation.appendChild(row);canvas.scrollTop=canvas.scrollHeight;return row.querySelector('.message-body')}
function send(){const text=input.value.trim();if(!text||busy)return;input.value='';message('user',text);currentAgent=message('agent','');busy=true;sendBtn.disabled=true;errorBox.style.display='none';CodexNative.sendMessage(text)}
function newChat(){CodexNative.newConversation();conversation.innerHTML='';welcome.style.display='block';currentAgent=null;busy=false;sendBtn.disabled=false;toggleSidebar(false);document.getElementById('threads').innerHTML='<div class="thread active">New coding task</div>'}
input.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send()}});input.addEventListener('input',()=>{input.style.height='auto';input.style.height=Math.min(input.scrollHeight,160)+'px'});
window.codex={onReady:id=>{document.getElementById('dot').className='status-dot ready';document.getElementById('statusText').textContent='Ready';errorBox.style.display='none'},onDelta:d=>{if(!currentAgent)currentAgent=message('agent','');currentAgent.textContent+=d;canvas.scrollTop=canvas.scrollHeight},onItem:type=>{if(type==='agentMessage'||type==='userMessage')return;const el=document.createElement('div');el.className='step';const names={reasoning:'Thinking',commandExecution:'Running a command',fileChange:'Editing files',mcpToolCall:'Using a tool',webSearch:'Searching the web'};el.textContent=names[type]||('Working · '+type);conversation.appendChild(el);canvas.scrollTop=canvas.scrollHeight},onTurnComplete:()=>{busy=false;currentAgent=null;sendBtn.disabled=false;document.getElementById('statusText').textContent='Ready'},onNativeError:e=>{errorBox.textContent=e;errorBox.style.display='block';document.getElementById('statusText').textContent='Error';busy=false;sendBtn.disabled=false},onLog:l=>console.log(l)};
</script>
</body></html>
